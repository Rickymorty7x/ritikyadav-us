<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Ritik Yadav at hello@ritikyadav.us." />
  <title>Contact — Ritik Yadav</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=4" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="site-header">
    <a class="logo" href="/">Ritik Yadav</a>
    <nav class="nav" aria-label="Primary">
      <a href="/about.html">About</a>
      <a href="/works.html">Works</a>
      <a href="/social.html">Social</a>
      <a href="/contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main class="shell">
    <h1 class="page-title">Contact</h1>
    <p class="page-lede">Say hello, ask a question, or share something you’re building.</p>
    <form class="contact-form" id="contact-form" action="mailto:hello@ritikyadav.us" method="get">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="button" type="submit">Send message</button>
      <p class="note">Or email directly: <a href="mailto:hello@ritikyadav.us">hello@ritikyadav.us</a></p>
    </form>
  </main>
  <footer class="site-footer">
    <span>© 2026 Ritik Yadav</span>
    <a href="mailto:hello@ritikyadav.us">hello@ritikyadav.us</a>
  </footer>
  <script>
    document.getElementById("contact-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var message = document.getElementById("message").value.trim();
      var subject = encodeURIComponent("Message from " + name);
      var body = encodeURIComponent("From: " + name + " <" + email + ">\n\n" + message);
      window.location.href = "mailto:hello@ritikyadav.us?subject=" + subject + "&body=" + body;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Ritik Yadav." />
  <title>Contact — Ritik Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="site-header">
    <a class="logo" href="/">Ritik Yadav</a>
    <nav class="nav" aria-label="Primary">
      <a href="/about.html">About</a>
      <a href="/works.html">Works</a>
      <a href="/social.html">Social</a>
      <a href="/contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main class="shell">
    <h1 class="page-title">Contact</h1>
    <p class="page-lede">Say hello, ask a question, or share something you’re building.</p>
    <form class="contact-form" action="mailto:hello@ritikyadav.us" method="post" enctype="text/plain">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="button" type="submit">Send message</button>
      <p class="note">Or email directly: <a class="cta" href="mailto:hello@ritikyadav.us" style="display:inline;margin:0;border:0;padding:0;">hello@ritikyadav.us</a></p>
    </form>
  </main>
</body>
</html>
